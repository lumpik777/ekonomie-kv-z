<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Příprava na test - Ekonomie (Kompletní 55 otázek)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50 shadow-md">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold text-indigo-400 flex items-center gap-2">
        <i class="fa-solid fa-graduation-cap"></i> Ekonomie - Kvíz (55 otázek)
      </h1>
      <div id="stats-header" class="hidden text-sm bg-slate-700 px-3 py-1 rounded-full font-semibold">
        Skóre: <span id="header-score" class="text-emerald-400">0</span> / <span id="header-total">0</span>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-grow max-w-4xl w-full mx-auto p-4 md:p-6 flex flex-col justify-center">

    <!-- VIEW 1: Selection -->
    <div id="view-selection" class="space-y-6 fade-in">
      <div class="text-center space-y-2">
        <h2 class="text-3xl font-extrabold text-white">Vyber si okruh k procvičování</h2>
        <p class="text-slate-400">Kompletní databáze obsahuje všech 55 otázek z tvých 5 listů na test.</p>
      </div>

      <!-- Mode Selector -->
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col sm:flex-row justify-center gap-4">
        <label class="flex items-center gap-2 cursor-pointer bg-slate-700/50 p-3 rounded-lg border border-slate-600 flex-1 hover:bg-slate-700 transition">
          <input type="radio" name="mode" value="quiz" checked class="accent-indigo-500 w-4 h-4">
          <div>
            <div class="font-semibold text-white">Interaktivní Kvíz</div>
            <div class="text-xs text-slate-400">Výběr z 4 možností & Pravda/Nepravda</div>
          </div>
        </label>
        <label class="flex items-center gap-2 cursor-pointer bg-slate-700/50 p-3 rounded-lg border border-slate-600 flex-1 hover:bg-slate-700 transition">
          <input type="radio" name="mode" value="flashcards" class="accent-indigo-500 w-4 h-4">
          <div>
            <div class="font-semibold text-white">Kartičky (Flashcards)</div>
            <div class="text-xs text-slate-400">Rychlé opakování a odkrývání odpovedí</div>
          </div>
        </label>
      </div>

      <!-- Topic Grid -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <button onclick="startApp('all')" class="md:col-span-2 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold p-5 rounded-xl shadow-lg transition transform hover:-translate-y-0.5 text-left flex justify-between items-center">
          <div>
            <div class="text-xl font-bold">🔥 Mix všech 55 otázek</div>
            <div class="text-sm text-indigo-100 font-normal">Kompletní náhodný test ze všech 5 fotek podkladů</div>
          </div>
          <i class="fa-solid fa-shuffle text-2xl"></i>
        </button>

        <button onclick="startApp(1)" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-4 rounded-xl transition text-left space-y-1 hover:border-indigo-500">
          <div class="text-xs font-bold text-indigo-400">TÉMA 1 (14 otázek)</div>
          <div class="font-bold text-lg text-white">Podnik a podnikání</div>
          <div class="text-xs text-slate-400">Definice, právní předpisy, životní fáze podniku, živnosti</div>
        </button>

        <button onclick="startApp(2)" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-4 rounded-xl transition text-left space-y-1 hover:border-indigo-500">
          <div class="text-xs font-bold text-indigo-400">TÉMA 2 (15 otázek)</div>
          <div class="font-bold text-lg text-white">Obchodní společnosti</div>
          <div class="text-xs text-slate-400">Založení, zrušení, likvidace, v.o.s., k.s., s.r.o., a.s., rejstřík</div>
        </button>

        <button onclick="startApp(3)" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-4 rounded-xl transition text-left space-y-1 hover:border-indigo-500">
          <div class="text-xs font-bold text-indigo-400">TÉMA 3 (14 otázek)</div>
          <div class="font-bold text-lg text-white">Majetek a fin. zdroje</div>
          <div class="text-xs text-slate-400">Dlouhodobý majetek, oběžný majetek, odpisy, vlastník a cizí zdroje</div>
        </button>

        <button onclick="startApp(4)" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-4 rounded-xl transition text-left space-y-1 hover:border-indigo-500">
          <div class="text-xs font-bold text-indigo-400">TÉMA 4 (11 otázek)</div>
          <div class="font-bold text-lg text-white">Mzda</div>
          <div class="text-xs text-slate-400">Základní mzdy, pobídkové složky, náhrady mezd, hrubá vs. čistá</div>
        </button>

        <button onclick="startApp(5)" class="md:col-span-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 p-4 rounded-xl transition text-left space-y-1 hover:border-indigo-500">
          <div class="text-xs font-bold text-indigo-400">TÉMA 5 (12 otázek)</div>
          <div class="font-bold text-lg text-white">Rozpočty</div>
          <div class="text-xs text-slate-400">Státní rozpočet, mandatorní výdaje, deficit, domácí rozpočet a investice</div>
        </button>
      </div>
    </div>

    <!-- VIEW 2: Quiz -->
    <div id="view-quiz" class="hidden fade-in space-y-6">
      <div class="space-y-2">
        <div class="flex justify-between text-xs text-slate-400 font-semibold">
          <span id="quiz-progress-text">Otázka 1 z 55</span>
          <span id="quiz-topic-tag" class="text-indigo-400 uppercase">Téma</span>
        </div>
        <div class="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden">
          <div id="quiz-progress-bar" class="bg-indigo-500 h-full transition-all duration-300 w-0"></div>
        </div>
      </div>

      <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-6">
        <h3 id="question-text" class="text-xl md:text-2xl font-bold text-white leading-relaxed">Načítání...</h3>
        <div id="options-container" class="space-y-3"></div>
        <div id="explanation-box" class="hidden p-4 rounded-xl text-sm leading-relaxed border fade-in">
          <div class="font-bold mb-1 flex items-center gap-2" id="explanation-title"></div>
          <div id="explanation-text" class="text-slate-300"></div>
        </div>
      </div>

      <div class="flex justify-between items-center">
        <button onclick="exitToMenu()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-sm font-semibold transition">
          <i class="fa-solid fa-arrow-left mr-2"></i> Zpět do menu
        </button>
        <button id="btn-next" onclick="nextQuestion()" class="hidden px-6 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-bold shadow-lg transition">
          Další otázka <i class="fa-solid fa-arrow-right ml-2"></i>
        </button>
      </div>
    </div>

    <!-- VIEW 3: Flashcards -->
    <div id="view-flashcards" class="hidden fade-in space-y-6">
      <div class="flex justify-between items-center text-xs text-slate-400 font-semibold">
        <span id="card-progress-text">Kartička 1 z 55</span>
        <button onclick="exitToMenu()" class="text-indigo-400 hover:underline">Zpět do menu</button>
      </div>

      <div class="bg-slate-800 border border-slate-700 rounded-2xl p-8 shadow-2xl min-h-[320px] flex flex-col justify-between items-center text-center">
        <div class="text-xs font-bold text-indigo-400 uppercase tracking-widest" id="card-topic-tag">TÉMA</div>
        <div class="my-auto space-y-4">
          <h3 id="card-question" class="text-xl md:text-2xl font-bold text-white leading-relaxed">Otázka...</h3>
          <div id="card-answer" class="hidden p-4 bg-slate-900/80 rounded-xl border border-slate-700 text-indigo-200 text-sm md:text-base leading-relaxed fade-in">
            Odpověď se načítá...
          </div>
        </div>
        <button id="btn-reveal" onclick="revealCardAnswer()" class="mt-4 px-6 py-2.5 bg-slate-700 hover:bg-slate-600 text-white rounded-lg font-semibold transition">
          <i class="fa-solid fa-eye mr-2"></i> Ukázat odpověď
        </button>
      </div>

      <div class="flex justify-between gap-4">
        <button onclick="prevCard()" class="flex-1 py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold rounded-xl transition">
          <i class="fa-solid fa-chevron-left mr-2"></i> Předchozí
        </button>
        <button onclick="nextCard()" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl transition">
          Další <i class="fa-solid fa-chevron-right ml-2"></i>
        </button>
      </div>
    </div>

    <!-- VIEW 4: Results -->
    <div id="view-results" class="hidden fade-in text-center space-y-6">
      <div class="bg-slate-800 border border-slate-700 rounded-2xl p-8 shadow-xl space-y-6">
        <div class="w-20 h-20 bg-indigo-500/20 text-indigo-400 rounded-full flex items-center justify-center mx-auto text-4xl">
          <i class="fa-solid fa-trophy"></i>
        </div>
        <div>
          <h2 class="text-3xl font-extrabold text-white">Test Dokončen!</h2>
          <p class="text-slate-400 text-sm mt-1">Zde je tvůj celkový výsledek</p>
        </div>
        <div class="bg-slate-900 p-6 rounded-xl border border-slate-700 inline-block min-w-[200px]">
          <div class="text-4xl font-extrabold text-emerald-400" id="results-score">0 / 0</div>
          <div class="text-xs text-slate-400 font-semibold mt-1" id="results-percentage">0 % úspěšnost</div>
        </div>
        <p id="results-feedback" class="text-slate-300 font-medium"></p>
        <button onclick="exitToMenu()" class="w-full sm:w-auto px-8 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl shadow-lg transition">
          Zpět na výběr okruhů
        </button>
      </div>
    </div>

  </main>

  <script>
    // FULL DATABASE OF ALL 55 QUESTIONS FROM 5 SHEETS
    const rawQuestions = [
      // --- TÉMA 1: PODNIK A PODNIKÁNÍ (14 Otázek) ---
      {
        topic: 1, topicName: "Podnik a podnikání", type: "mcq",
        question: "1. Jaká je přesná zákonná definice podnikání podle Občanského zákoníku?",
        options: [
          { text: "Soustavná činnost prováděná samostatně, vlastním jménem, na vlastní odpovědnost za účelem zisku.", correct: true },
          { text: "Jednorázový prodej osobního majetku na internetovém bazaru s cílem získat finanční hotovost.", correct: false },
          { text: "Práce vykonávaná v hlavním pracovním poměru podle pokynů přímého nadřízeného manažera.", correct: false },
          { text: "Činnost vyvíjená bezplatně v neziskové organizaci pro veřejné blaho a podporu komunity.", correct: false }
        ],
        explanation: "Podnikatelem je ten, kdo samostatně vykonává na vlastní účet a odpovědnost živnostenským nebo obdobným způsobem výdělečnou činnost se záměrem činit tak soustavně za účelem dosažení zisku."
      },
      {
        topic: 1, topicName: "Podnik a podnikání", type: "mcq",
        question: "2. Které dva hlavní právní předpisy upravují podnikání v ČR (vztahy a předpoklady)?",
        options: [
          { text: "Občanský zákoník (č. 89/2012 Sb.) a Živnostenský zákon (č. 455/1991 Sb.).", correct: true },
          { text: "Zákoník práce a Zákon o platových poměrech zaměstnanců ve státní správě.", correct: false },
          { text: "Trestní zákoník a Zákon o policie České republiky pro vymáhání práva.", correct: false },
          { text: "Zákon o státním rozpočtu a Zákon o České národní bance pro regulaci měny.", correct: false }
        ],
        explanation: "Základní soukromoprávní úpravu podnikání obsahuje Občanský zákoník (včetně Zákona o obchodních korporacích) a veřejnoprávní podmínky upravuje Živnostenský zákon."
      },
      {
        topic: 1, topicName: "Podnik a podnikání", type: "tf",
        question: "3. Tradiční životní cyklus podniku se skládá ze 4 základních fází: Založení, Růst, Stabilizace a Krize/Zánik.",
        correct: true,
        explanation: "Pravda. Každý podnik prochází fázemi zakládání, rozvoje (růstu), zralosti (stabilizace) a v případě poklesu krizí, která končí buď revitalizací, nebo zánikem."
      },
      {
        topic: 1, topicName: "Podnik a podnikání", type: "mcq",
        question: "4. Co charakterizuje fázi životního cyklu podniku s názvem 'Založení podniku'?",
        options: [
          { text: "Průzkum trhu, tvorba podnikatelského záměru, zajištění kapitálu a zápis do rejstříku.", correct: true },
          { text: "Rychlý nárůst tržeb, masivní nabírání nových zaměstnanců a rozšiřování poboček.", correct: false },
          { text: "Dosažení maximálního tržního podílu a udržování stabilních zisků z prodeje.", correct: false },
          { text: "Rozprodej majetku podniku a vyrovnání všech nesplacených závazků vůči věřitelům.", correct: false }
        ],
        explanation: "Fáze založení zahrnuje přípravu zakladatelských dokumentů, stanovení předmětu podnikání, obstarání počátečního kapitálu a právní vznik podniku."
      },
      {
        topic: 1, topicName: "Podnik a podnikání", type: "mcq",
        question: "5. Co charakterizuje fázi 'Růst podniku'?",
        options: [
          { text: "Zvyšování objemu výroby a prodeje, získávání nových zákazníků a tvorba prvních zisků.", correct: true },
          { text: "Pokles poptávky po produktech podniku spojený s propouštěním klíčových pracovníků.", correct: false },
          { text: "Jednorázový podpis zakladatelské listiny na notářství a uhradění správních poplatků.", correct: false },
          { text: "Jmenování likvidátora a vymazání podniku ze státního obchodního rejstříku.", correct: false }
        ],
        explanation: "V růstové fázi se podnik prosazuje na trhu, rostou mu tržby, stabilizují se zákazníci a firma reinvestuje zisk do svého rozvoje."
      },
      {
        topic: 1, topicName: "Podnik a podnikání", type: "mcq",
        question: "6. Co charakterizuje fázi 'Stabilizace podniku' (zralost)?",
        options: [
          { text: "Podnik dosahuje maximálního objemu tržeb, má stálou klientelu a optimalizuje své náklady.", correct: true },
          { text: "Podnik trpí akutním nedostatkem hotovosti a není schopen platit dodavatelské faktury.", correct: false },
          { text: "Zakladatelé teprve podávají žádost o živnostenské oprávnění na živnostenském úřadě.", correct: false },
          { text: "Vyhlašuje se insolvenční řízení z důvodu předlužení a neschopnosti splácet dluhy.", correct: false }
        ],
        explanation: "Fáze stabilizace je obdobím zralosti, kdy firma generuje stabilní cash-flow, spravuje zavedený trh a udržuje si konkurenceschopnost."
      },
      {
        topic: 1, topicName: "Podnik a podnikání", type: "mcq",
        question: "7. Co se děje ve fázi 'Krize podniku'?",
        options: [
          { text: "Dochází ke poklesu prodejů, ztrátě konkurenceschopnosti a finančním problémům.", correct: true },
          { text: "Firma zažívá historicky nejvyšší meziroční růst tržeb a expanduje na zahraniční trhy.", correct: false },
          { text: "Zákazníci stojí ve frontách na nové produkty a firma nestíhá vyrábět z důvodu poptávky.", correct: false },
          { text: "Registruje se nová ochranná známka a otevírá se hlavní sídlo společnosti v Praze.", correct: false }
        ],
        explanation: "Krize nastává při zastarání produktů či špatném řízení. Podnik musí provést restrukturalizaci a ozdravné kroky, jinak směřuje k úpadku."
      },
      {
        topic: 1, topicName: "Podnik a podnikání", type: "mcq",
        question: "8. Co charakterizuje fázi 'Zánik podniku'?",
        options: [
          { text: "Úplné ukončení činnosti podniku spojené s výmazem z obchodního rejstříku.", correct: true },
          { text: "Zahájení rozsáhlé reklamní kampaně v televizi pro znovuzískání ztracených zákazníků.", correct: false },
          { text: "Přijetí desítek nových kvalifikovaných zaměstnanců do výzkumného oddělení.", correct: false },
          { text: "Zvýšení základního kapitálu upsáním nových akcií stávajícími společníky.", correct: false }
        ],
        explanation: "Zánik podniku navazuje na jeho zrušení (s likvidací či bez) a nastává právním výmazem subjektu z obchodního rejstříku."
      },
      {
        topic: 1, topicName: "Podnik a podnikání", type: "mcq",
        question: "9. Jak dělíme podniky v ČR podle jejich právní formy?",
        options: [
          { text: "Podniky jednotlivců (OSVČ), obchodní společnosti, družstva a státní podniky.", correct: true },
          { text: "Podniky tuzemské, evropské, asijské a zámořské podle původu kapitálu.", correct: false },
          { text: "Podniky ziskové, vysoce ziskové, ztrátové a bankrotující podle přiznání.", correct: false },
          { text: "Podniky malé do 5 lidí a velké nad 10 000 lidí bez ohledu na strukturu.", correct: false }
        ],
        explanation: "Právní formy se dělí na fyzické osoby (OSVČ), právnické osoby (obchodní společnosti osobní a kapitálové), družstva a státní či městské podniky."
      },
      {
        topic: 1, topicName: "Podnik a podnikání", type: "mcq",
        question: "10. Napiš definici živnostenského podnikání a uveď, který zákon ho upravuje.",
        options: [
          { text: "Soustavná činnost provozovaná samostatně za podmínek stanovených Živnostenským zákonem.", correct: true },
          { text: "Činnost vykonávaná zaměstnancem na základě dohody podle Zákoníku práce.", correct: false },
          { text: "Příležitostný prodej zemědělských přebytků podle Zákona o myslivosti.", correct: false },
          { text: "Správa vlastního majetku a investic podléhající Zákonu o burze cenných papírů.", correct: false }
        ],
        explanation: "Živností je soustavná činnost provozovaná samostatně, vlastním jménem, na vlastní odpovědnost, za účelem dosažení zisku a za podmínek stanovených zák. č. 455/1991 Sb. (Živnostenský zákon)."
      },
      {
        topic: 1, topicName: "Podnik a podnikání", type: "mcq",
        question: "11. Které z následujících činností NEPATŘÍ mezi živnosti (neřídí se živnostenským zákonem)?",
        options: [
          { text: "Činnost lékařů, advokátů, notářů, daňových poradců a autorské vědecké/umělecké činnosti.", correct: true },
          { text: "Poskytování kadeřnických, kosmetických, pedikérských a masérských služeb.", correct: false },
          { text: "Maloobchodní a velkoobchodní prodej spotřebního zboží a elektroniky.", correct: false },
          { text: "Vodoinstalatérské, zednické, zámečnické a truhlářské práce.", correct: false }
        ],
        explanation: "Svobodná povolání (lékaři, právníci), zemědělství nebo činnost bank a pojišťoven se řídí samostatnými specializovanými zákony, nikoliv živnostenským zákonem."
      },
      {
        topic: 1, topicName: "Podnik a podnikání", type: "mcq",
        question: "12. Kdo může v ČR provozovat živnost a jaké všeobecné podmínky musí splnit?",
        options: [
          { text: "Fyzická nebo právnická osoba: věk 18 let, svéprávnost a bezúhonnost (čistý trestní rejstřík).", correct: true },
          { text: "Každý občan ČR starší 15 let bez ohledu na bezúhonnost a svéprávnost.", correct: false },
          { text: "Pouze osoba s vysokoškolským vzděláním v oboru ekonomie nebo práva.", correct: false },
          { text: "Pouze český občan, který předloží potvrzení o vlastnictví nemovitosti.", correct: false }
        ],
        explanation: "Všeobecné podmínky pro provozování živnosti fyzickou osobou jsou: dosažení věku 18 let, plná svéprávnost a bezúhonnost v oboru."
      },
      {
        topic: 1, topicName: "Podnik a podnikání", type: "mcq",
        question: "13. Jak dělíme živnosti ohlašovací a koncesované?",
        options: [
